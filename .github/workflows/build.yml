package com.example.autoattack.gui;
import com.example.autoattack.AutoAttackModule;
import com.example.autoattack.KeybindManager;
import net.minecraft.client.gui.DrawContext;
import net.minecraft.client.gui.screen.Screen;
import net.minecraft.client.gui.widget.ButtonWidget;
import net.minecraft.client.gui.widget.SliderWidget;
import net.minecraft.client.option.KeyBinding;
import net.minecraft.client.util.InputUtil;
import net.minecraft.text.Text;
import java.util.function.Consumer;

public class AutoAttackScreen extends Screen {
    private final AutoAttackModule module; private final KeyBinding toggleKey; private boolean listeningForKey = false;
    public AutoAttackScreen(AutoAttackModule module, KeyBinding toggleKey) { super(Text.literal("AutoAttack Settings")); this.module = module; this.toggleKey = toggleKey; }
    @Override protected void init() {
        super.init(); int cx = this.width / 2; int y = 40;
        addDrawableChild(ButtonWidget.builder(Text.literal("AutoAttack: " + (module.isEnabled() ? "ON" : "OFF")), btn -> { module.toggle(); btn.setMessage(Text.literal("AutoAttack: " + (module.isEnabled() ? "ON" : "OFF"))); }).bounds(cx - 100, y, 200, 20).build()); y += 25;
        addDrawableChild(createToggle("Target Players", module::isTargetPlayers, module::setTargetPlayers, cx - 100, y)); y += 22;
        addDrawableChild(createToggle("Target Mobs", module::isTargetMobs, module::setTargetMobs, cx - 100, y)); y += 30;
        addDrawableChild(new FovSlider(cx - 100, y, 200, 20, module)); y += 30;
        addDrawableChild(createToggle("Legit Mode", module::isLegitMode, module::setLegitMode, cx - 100, y)); y += 22;
        addDrawableChild(createToggle("No Eat/Drink", module::isNoAttackWhileUsingItem, module::setNoAttackWhileUsingItem, cx - 100, y)); y += 22;
        addDrawableChild(createToggle("No Shield", module::isNoAttackWhileBlocking, module::setNoAttackWhileBlocking, cx - 100, y)); y += 22;
        addDrawableChild(createToggle("Only Criticals", module::isOnlyCriticals, module::setOnlyCriticals, cx - 100, y)); y += 30;
        addDrawableChild(ButtonWidget.builder(Text.literal("Toggle Key: " + toggleKey.getBoundKeyLocalizedText().getString()), btn -> { listeningForKey = true; btn.setMessage(Text.literal("Press a key...")); }).bounds(cx - 100, y, 200, 20).build()); y += 25;
        addDrawableChild(ButtonWidget.builder(Text.literal("Done"), btn -> { KeybindManager.save(module, toggleKey); this.close(); }).bounds(cx - 50, y, 100, 20).build());
    }
    private ButtonWidget createToggle(String label, java.util.function.BooleanSupplier getter, Consumer<Boolean> setter, int x, int y) {
        return ButtonWidget.builder(Text.literal(label + ": " + (getter.getAsBoolean() ? "ON" : "OFF")), btn -> { boolean nv = !getter.getAsBoolean(); setter.accept(nv); btn.setMessage(Text.literal(label + ": " + (nv ? "ON" : "OFF"))); }).bounds(x, y, 200, 20).build();
    }
    private static class FovSlider extends SliderWidget {
        private final AutoAttackModule m; public FovSlider(int x, int y, int w, int h, AutoAttackModule m) { super(x, y, w, h, Text.empty(), (m.getFov() - 1) / 359.0); this.m = m; updateMessage(); }
        @Override protected void updateMessage() { setMessage(Text.literal("FOV: " + (int) m.getFov() + "\u00b0")); }
        @Override protected void applyValue() { m.setFov((float) (1 + value * 359)); }
    }
    @Override public void render(DrawContext ctx, int mx, int my, float d) { super.render(ctx, mx, my, d); ctx.drawCenteredTextWithShadow(this.textRenderer, this.title, this.width / 2, 15, 0xFFFFFF); }
    @Override public boolean keyPressed(int keyCode, int scanCode, int modifiers) { if (listeningForKey) { toggleKey.setBoundKey(InputUtil.Type.KEYSYM.createFromCode(keyCode)); listeningForKey = false; this.clearAndInit(); return true; } return super.keyPressed(keyCode, scanCode, modifiers); }
    @Override public boolean shouldPause() { return false; }
}
