package com.example.autoattack;
import com.example.autoattack.gui.AutoAttackScreen;
import com.example.autoattack.render.FovRenderer;
import net.fabricmc.api.ClientModInitializer;
import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
import net.minecraft.client.MinecraftClient;
import net.minecraft.client.option.KeyBinding;
import net.minecraft.client.util.InputUtil;
import net.minecraft.util.Identifier;
import org.lwjgl.glfw.GLFW;

public class AutoAttackMod implements ClientModInitializer {
    public static final String MOD_ID = "autoattackmod";
    private static AutoAttackMod instance;
    private KeyBinding openGuiKey;
    private KeyBinding toggleModuleKey;
    private final AutoAttackModule module = new AutoAttackModule();
    public static AutoAttackMod getInstance() { return instance; }
    public AutoAttackModule getModule() { return module; }
    public KeyBinding getToggleKey() { return toggleModuleKey; }

    @Override
    public void onInitializeClient() {
        instance = this;
        KeyBinding.Category category = KeyBinding.Category.create(Identifier.of(MOD_ID, "main"));
        openGuiKey = KeyBindingHelper.registerKeyBinding(new KeyBinding("key." + MOD_ID + ".open_gui", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_RIGHT_SHIFT, category));
        toggleModuleKey = KeyBindingHelper.registerKeyBinding(new KeyBinding("key." + MOD_ID + ".toggle_module", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_R, category));
        KeybindManager.load(module, toggleModuleKey);
        ClientTickEvents.END_CLIENT_TICK.register(this::onEndTick);
        HudRenderCallback.EVENT.register(new FovRenderer(module));
    }
    private void onEndTick(MinecraftClient client) {
        while (openGuiKey.wasPressed()) client.setScreen(new AutoAttackScreen(module, toggleModuleKey));
        while (toggleModuleKey.wasPressed()) module.toggle();
        if (module.isEnabled()) module.tick(client);
    }
}
