package com.example.autoattack.render;
import com.example.autoattack.AutoAttackModule;
import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
import net.minecraft.client.MinecraftClient;
import net.minecraft.client.gui.DrawContext;
import net.minecraft.client.render.RenderTickCounter;

public class FovRenderer implements HudRenderCallback {
    private final AutoAttackModule module; public FovRenderer(AutoAttackModule m) { this.module = m; }
    @Override public void onHudRender(DrawContext ctx, RenderTickCounter tickCounter) {
        MinecraftClient client = MinecraftClient.getInstance(); if (client.player == null || !module.isEnabled() || module.getFov() >= 180f) return;
        int cx = ctx.getScaledWindowWidth() / 2, cy = ctx.getScaledWindowHeight() / 2, radius = 40;
        double sa = -Math.toRadians(module.getFov() / 2.0), ea = Math.toRadians(module.getFov() / 2.0);
        int steps = Math.max(10, (int) (module.getFov() * 2)), color = 0x88FFFFFF;
        for (int i = 0; i < steps; i++) {
            double a1 = sa + (ea - sa) * i / steps, a2 = sa + (ea - sa) * (i + 1) / steps;
            drawLine(ctx, (int) (cx + radius * Math.sin(a1)), (int) (cy - radius * Math.cos(a1)), (int) (cx + radius * Math.sin(a2)), (int) (cy - radius * Math.cos(a2)), color);
        }
        ctx.drawText(client.textRenderer, String.format("FOV: %.0f\u00b0", module.getFov()), cx - 20, cy - radius - 15, 0xFFFFFF, true);
    }
    private void drawLine(DrawContext ctx, int x1, int y1, int x2, int y2, int color) {
        int dx = Math.abs(x2 - x1), dy = Math.abs(y2 - y1), sx = x1 < x2 ? 1 : -1, sy = y1 < y2 ? 1 : -1, err = dx - dy;
        while (true) { ctx.fill(x1, y1, x1 + 1, y1 + 1, color); if (x1 == x2 && y1 == y2) break; int e2 = 2 * err; if (e2 > -dy) { err -= dy; x1 += sx; } if (e2 < dx) { err += dx; y1 += sy; } }
    }
}
