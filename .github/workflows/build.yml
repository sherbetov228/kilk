package com.example.autoattack;
import net.minecraft.client.option.KeyBinding;
import net.minecraft.client.util.InputUtil;
import java.io.InputStream;
import java.io.OutputStream;
import java.nio.file.Files;
import java.nio.file.Path;
import java.util.Properties;

public class KeybindManager {
    private static final Path CONFIG_PATH = Path.of("config", "autoattackmod.properties");
    public static void save(AutoAttackModule m, KeyBinding k) {
        try {
            Files.createDirectories(CONFIG_PATH.getParent());
            Properties p = new Properties();
            p.setProperty("toggleKey", k.getBoundKeyTranslationKey());
            p.setProperty("enabled", String.valueOf(m.isEnabled()));
            p.setProperty("targetPlayers", String.valueOf(m.isTargetPlayers()));
            p.setProperty("targetMobs", String.valueOf(m.isTargetMobs()));
            p.setProperty("fov", String.valueOf(m.getFov()));
            p.setProperty("legitMode", String.valueOf(m.isLegitMode()));
            p.setProperty("noAttackWhileUsingItem", String.valueOf(m.isNoAttackWhileUsingItem()));
            p.setProperty("noAttackWhileBlocking", String.valueOf(m.isNoAttackWhileBlocking()));
            p.setProperty("onlyCriticals", String.valueOf(m.isOnlyCriticals()));
            try (OutputStream out = Files.newOutputStream(CONFIG_PATH)) { p.store(out, "AutoAttack Mod Config"); }
        } catch (Exception e) { e.printStackTrace(); }
    }
    public static void load(AutoAttackModule m, KeyBinding k) {
        if (!Files.exists(CONFIG_PATH)) return;
        try (InputStream in = Files.newInputStream(CONFIG_PATH)) {
            Properties p = new Properties(); p.load(in);
            String savedKey = p.getProperty("toggleKey"); if (savedKey != null) k.setBoundKey(InputUtil.fromTranslationKey(savedKey));
            m.setEnabled(Boolean.parseBoolean(p.getProperty("enabled", "false")));
            m.setTargetPlayers(Boolean.parseBoolean(p.getProperty("targetPlayers", "true")));
            m.setTargetMobs(Boolean.parseBoolean(p.getProperty("targetMobs", "true")));
            m.setFov(Float.parseFloat(p.getProperty("fov", "90")));
            m.setLegitMode(Boolean.parseBoolean(p.getProperty("legitMode", "false")));
            m.setNoAttackWhileUsingItem(Boolean.parseBoolean(p.getProperty("noAttackWhileUsingItem", "false")));
            m.setNoAttackWhileBlocking(Boolean.parseBoolean(p.getProperty("noAttackWhileBlocking", "false")));
            m.setOnlyCriticals(Boolean.parseBoolean(p.getProperty("onlyCriticals", "false")));
        } catch (Exception e) { e.printStackTrace(); }
    }
}
