@"
package com.example.autoattack;
import net.minecraft.client.MinecraftClient;
import net.minecraft.entity.LivingEntity;
import net.minecraft.entity.mob.MobEntity;
import net.minecraft.entity.player.PlayerEntity;
import net.minecraft.item.ShieldItem;
import net.minecraft.util.Hand;
import net.minecraft.util.math.Vec3d;
import java.util.Comparator;

public class AutoAttackModule {
    private boolean enabled = false, targetPlayers = true, targetMobs = true, legitMode = false, noAttackWhileUsingItem = false, noAttackWhileBlocking = false, onlyCriticals = false;
    private float fov = 90f;
    public boolean isEnabled() { return enabled; }
    public void setEnabled(boolean v) { enabled = v; }
    public void toggle() { enabled = !enabled; }
    public boolean isTargetPlayers() { return targetPlayers; }
    public void setTargetPlayers(boolean v) { targetPlayers = v; }
    public boolean isTargetMobs() { return targetMobs; }
    public void setTargetMobs(boolean v) { targetMobs = v; }
    public float getFov() { return fov; }
    public void setFov(float v) { fov = Math.max(1f, Math.min(360f, v)); }
    public boolean isLegitMode() { return legitMode; }
    public void setLegitMode(boolean v) { legitMode = v; }
    public boolean isNoAttackWhileUsingItem() { return noAttackWhileUsingItem; }
    public void setNoAttackWhileUsingItem(boolean v) { noAttackWhileUsingItem = v; }
    public boolean isNoAttackWhileBlocking() { return noAttackWhileBlocking; }
    public void setNoAttackWhileBlocking(boolean v) { noAttackWhileBlocking = v; }
    public boolean isOnlyCriticals() { return onlyCriticals; }
    public void setOnlyCriticals(boolean v) { onlyCriticals = v; }

    public void tick(MinecraftClient client) {
        if (client.player == null || client.world == null || client.interactionManager == null) return;
        if (legitMode) {
            if (noAttackWhileUsingItem && client.player.isUsingItem()) return;
            if (noAttackWhileBlocking && isBlocking(client)) return;
            if (onlyCriticals && !(!client.player.isOnGround() && client.player.fallDistance > 0.0f)) return;
        }
        if (client.player.getAttackCooldownProgress(0.5f) < 1.0f) return;
        Vec3d playerPos = client.player.getPos(), lookVec = client.player.getRotationVec(1.0f).normalize();
        LivingEntity target = client.world.getEntitiesByClass(LivingEntity.class, client.player.getBoundingBox().expand(6.0), e -> e != client.player && e.isAlive())
            .stream().filter(e -> (e instanceof PlayerEntity && targetPlayers) || (e instanceof MobEntity && targetMobs))
            .filter(e -> { if (fov >= 360f) return true; Vec3d toT = e.getPos().subtract(playerPos).normalize(); double dot = lookVec.dotProduct(toT); return Math.toDegrees(Math.acos(Math.max(-1, Math.min(1, dot)))) <= fov / 2.0; })
            .min(Comparator.comparingDouble(e -> e.squaredDistanceTo(client.player))).orElse(null);
        if (target != null) { client.interactionManager.attackEntity(client.player, target); client.player.swingHand(Hand.MAIN_HAND); }
    }
    private boolean isBlocking(MinecraftClient c) { return c.player.isBlocking() || (c.player.getOffHandStack().getItem() instanceof ShieldItem && c.player.isUsingItem()); }
}
